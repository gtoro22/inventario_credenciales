name: tests

on: [push, pull_request]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: credential_vault_test
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, pdo_mysql, sqlite3' }
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests (SQLite en memoria)
        run: php artisan test
      - name: Migraciones e instalación sobre MySQL real
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: credential_vault_test
          DB_USERNAME: root
          DB_PASSWORD: ci-only-root
        run: php artisan credentials:install --with-demo-data --email=ci@example.test --no-interaction
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
