# Producción / evaluación local:
#   cp .env.docker.example .env.docker   (completa los valores marcados)
#   docker compose --env-file .env.docker up -d --build
name: credential-vault

x-app-env: &app-env
  APP_NAME: "Credential Vault"
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost:8080}
  APP_KEY: ${APP_KEY:?Define APP_KEY en .env.docker (php artisan key:generate --show)}
  VAULT_KEY: ${VAULT_KEY:?Define VAULT_KEY en .env.docker (php artisan credentials:generate-key)}
  VAULT_PREVIOUS_KEYS: ${VAULT_PREVIOUS_KEYS:-}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-credential_vault}
  DB_USERNAME: ${DB_USERNAME:-vault}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}

services:
  # ---- Base de datos ----
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-credential_vault}
      MYSQL_USER: ${DB_USERNAME:-vault}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env.docker}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  # ---- Backend (Laravel + PHP-FPM) ----
  app:
    build: { context: ., target: app }
    image: credential-vault/app:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  # ---- Tareas programadas (expiración diaria de credenciales) ----
  scheduler:
    image: credential-vault/app:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app: { condition: service_started }
    networks: [backend]

  # ---- Frontend + proxy (nginx sirve los assets de React/Ant Design y envía PHP a app) ----
  web:
    build: { context: ., target: web }
    image: credential-vault/web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app: { condition: service_started }
    networks: [backend]

volumes:
  db-data:
  storage:

networks:
  backend:
